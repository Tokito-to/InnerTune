name: Build Release APK
on:
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d >> app/music-release.jks

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
          cache: 'gradle'

      - name: Build Release APK
        run: ./gradlew assembleFossRelease

      - name: Sign Release APK
        run: |
          timestamp="$(TZ=Asia/Kolkata date +"%Y%m%d")"
          apksigner="$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)"
          "$apksigner" sign --ks app/music-release.jks \
          --ks-key-alias release \
          --ks-pass pass:"${{ secrets.SIGNING_PASSWORD }}" \
          --key-pass pass:"${{ secrets.SIGNING_PASSWORD }}" \
          --in ./app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk \
          --out ./app/build/outputs/apk/foss/release/InnerTune_foss-${timestamp}.apk

      - name: Fetch Latest Changelog
        id: body
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$(curl -s https://api.github.com/repos/z-huang/InnerTune/releases/latest | jq -r '.body')" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: TimeStamp
        id: timestamp
        run: echo "TIMESTAMP=$(TZ=Asia/Kolkata date +\"%Y%m%d\")" >> $GITHUB_OUTPUT

      - name: Upload modules to release
        uses: svenstaro/upload-release-action@v2
        with:
          body: ${{ steps.body.outputs.BUILD_LOG }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./app/build/outputs/apk/foss/release/InnerTune_foss-*.apk
          release_name: InnerTune-Foss
          tag: ${{ steps.timestamp.outputs.TIMESTAMP }}
          file_glob: true
          overwrite: true
